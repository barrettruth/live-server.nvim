name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  luarocks-nightly:
    name: LuaRocks (nightly)
    runs-on: nix
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Wait for quality
        run: nix shell nixpkgs#curl nixpkgs#jq -c bash .forgejo/scripts/wait-for-quality.sh

      - name: Compute LuaRocks specrev
        run: echo "LUAROCKS_SPECREV=$(git rev-list --count "$FORGEJO_SHA")" >> "$FORGEJO_ENV"

      - name: Publish nightly LuaRocks
        uses: https://forge.barrettruth.com/barrettruth/luarocks-tag-release-forgejo@v0.2.0
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          version: scm
          specrev: ${{ env.LUAROCKS_SPECREV }}
          license: GPL-3.0
          verification_servers: |
            https://luarocks.org/manifests/barrettruth
            https://luarocks.org/dev
